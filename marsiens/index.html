<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background:#0b1e33 radial-gradient(circle at 50% 15%,#1a4470 0%,#0b1e33 65%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

canvas{height:min(calc(100dvh - 56px),calc(100vw * 512 / 288));width:auto;max-width:100vw;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.55);touch-action:none;cursor:pointer}
#mute{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:16px;line-height:34px;padding:0;cursor:pointer}

<body>
<div class="stage">
  <canvas id="game" width="288" height="512" aria-label="Flappy Marsien : tape pour faire voler la soucoupe"></canvas>
  <button id="mute" type="button" aria-label="Activer ou couper le son">🔊</button>
</div>
<footer><a href="https://www.instagram.com/les_marsiens_13/" target="_blank" rel="noopener">@les_marsiens_13</a> · Marseille 👽 · Espace, clic ou tape pour voler</footer>
<script>
(function(){
'use strict';
var W=288,H=512,FLOOR=400,SEA_Y=300;
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);

/* ---- réglages : plus doux que Flappy Bird, difficulté qui monte avec le score ---- */
var G=0.2,FLAP_V=-3.7,MAX_V=6,BASE_SPEED=2,PIPE_W=52,PIPE_DIST=186,CAP_H=24;
var SHIP_X=70,HIT_W=36,HIT_H=20;
function curGap(){return 126-Math.min(score,20);}          /* 126 px au départ, 106 px à partir de 20 points */
function curSpeed(){return BASE_SPEED+Math.min(score,30)*0.015;} /* 2 → 2,45 px/image */
var FONT='"Press Start 2P","Courier New",monospace';
var IG=['#feda75','#fa7e1e','#d62976','#962fbf','#4f5bd5'];
var GREEN='#17a34a';
var GOND=['#e63946','#f4a261','#2a9d8f','#457b9d','#ffd166','#9b5de5'];

/* ---- utilitaires ---- */
function rng(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function tile(w,h,draw){var c=document.createElement('canvas');c.width=w*DPR;c.height=h*DPR;var x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);draw(x);return{c:c,w:w,h:h};}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function text(str,x,y,size,fill,stroke,align,lw){ctx.font=size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=lw||Math.max(2,size/4);ctx.strokeStyle=stroke;ctx.strokeText(str,x,y);}ctx.fillStyle=fill;ctx.fillText(str,x,y);}

/* ---- le martien (logo les_marsiens_13) ---- */
function drawAlien(c,x,y,s,fill,eye){
  c.save();c.translate(x,y);c.scale(s*0.86,s);
  c.beginPath();c.moveTo(0,-1);
  c.bezierCurveTo(0.68,-1,1.04,-0.62,1,-0.2);
  c.bezierCurveTo(0.96,0.3,0.5,0.8,0,1);
  c.bezierCurveTo(-0.5,0.8,-0.96,0.3,-1,-0.2);
  c.bezierCurveTo(-1.04,-0.62,-0.68,-1,0,-1);
  c.closePath();c.fillStyle=fill;c.fill();
  c.fillStyle=eye;
  for(var i=0;i<2;i++){var sg=i?1:-1;c.save();c.translate(sg*0.43,-0.1);c.scale(sg,1);c.rotate(-0.62);
    c.beginPath();c.moveTo(-0.44,0.02);c.bezierCurveTo(-0.12,-0.3,0.26,-0.28,0.4,-0.08);c.bezierCurveTo(0.52,0.1,0.2,0.28,-0.02,0.22);c.bezierCurveTo(-0.22,0.17,-0.38,0.1,-0.44,0.02);c.closePath();c.fill();c.restore();}
  c.restore();
}

/* ---- la soucoupe ---- */
function drawShip(c,x,y,rot,now,thrust){
  c.save();c.translate(x,y);c.rotate(rot);
  if(thrust){var tg=c.createRadialGradient(0,9,1,0,9,14);tg.addColorStop(0,'rgba(214,41,118,0.55)');tg.addColorStop(1,'rgba(214,41,118,0)');c.fillStyle=tg;c.beginPath();c.ellipse(0,10,14,9,0,0,Math.PI*2);c.fill();}
  drawAlien(c,0,-10,9,GREEN,'#fff');
  c.beginPath();c.arc(0,-2,17,Math.PI,0);c.closePath();
  var dg=c.createLinearGradient(0,-19,0,-2);dg.addColorStop(0,'rgba(225,246,255,0.55)');dg.addColorStop(1,'rgba(140,205,255,0.18)');
  c.fillStyle=dg;c.fill();c.lineWidth=1.3;c.strokeStyle='rgba(255,255,255,0.85)';c.stroke();
  c.beginPath();c.ellipse(-7.5,-12,4.5,1.9,-0.55,0,Math.PI*2);c.fillStyle='rgba(255,255,255,0.75)';c.fill();
  var bg=c.createLinearGradient(0,-8,0,8);bg.addColorStop(0,'#f4f7fa');bg.addColorStop(0.45,'#c3ccd6');bg.addColorStop(1,'#707b88');
  c.beginPath();c.ellipse(0,0,24,8,0,0,Math.PI*2);c.fillStyle=bg;c.fill();c.lineWidth=1.5;c.strokeStyle='#39424d';c.stroke();
  c.beginPath();c.ellipse(0,3.5,15,4.2,0,0,Math.PI);c.fillStyle='#4b5563';c.fill();
  var xs=[-17,-8.5,0,8.5,17],k=Math.floor(now/110)%5;
  for(var i=0;i<5;i++){var on=i===k;c.globalAlpha=on?1:0.8;c.beginPath();c.arc(xs[i],2.2,2.2,0,Math.PI*2);c.fillStyle=IG[i];c.fill();
    if(on){c.globalAlpha=0.35;c.beginPath();c.arc(xs[i],2.2,4.5,0,Math.PI*2);c.fill();}}
  c.globalAlpha=1;c.restore();
}

/* ---- avatar Instagram (anneau dégradé) ---- */
function drawAvatar(c,x,y,r){
  var g=c.createLinearGradient(x-r,y+r,x+r,y-r);for(var i=0;i<IG.length;i++)g.addColorStop(i/(IG.length-1),IG[i]);
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=g;c.fill();
  c.beginPath();c.arc(x,y,r-4,0,Math.PI*2);c.fillStyle='#fff';c.fill();
  drawAlien(c,x,y+1,(r-7)*0.8,GREEN,'#fff');
}

/* ---- la patte Marsiens : tags à la bombe ---- */
var TAGFONT='"Bangers",Impact,"Arial Black",sans-serif';
var TAGCOLS=['#ff2d95','#9b5de5','#fa7e1e','#1fd3ff','#feda75',GREEN];
function tagText(c,str,x,y,size,col,dark,rot,skew){
  c.save();c.translate(x,y);c.rotate(rot||0);c.transform(1,0,skew||0,1,0,0);
  c.font=size+'px '+TAGFONT;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  c.shadowColor=col;c.shadowBlur=size*0.5;c.fillStyle=col;c.fillText(str,0,0);c.shadowBlur=0;
  c.lineWidth=size*0.26;c.strokeStyle='#15161a';c.strokeText(str,0,0);
  c.fillStyle=dark;c.fillText(str,size*0.08,size*0.08);
  c.lineWidth=size*0.11;c.strokeStyle='#fff';c.strokeText(str,0,0);
  c.fillStyle=col;c.fillText(str,0,0);
  c.restore();
}
function drips(c,x,y,w,col,seed){var r=rng(seed);c.strokeStyle=col;c.fillStyle=col;c.lineCap='round';
  for(var i=0;i<4;i++){var dx=x-w/2+r()*w,len=5+r()*14,lw=1.5+r()*1.5;c.lineWidth=lw;c.beginPath();c.moveTo(dx,y);c.lineTo(dx,y+len);c.stroke();c.beginPath();c.arc(dx,y+len,lw*0.8,0,Math.PI*2);c.fill();}}
function splat(c,x,y,col,seed,n){var r=rng(seed);c.fillStyle=col;
  for(var i=0;i<n;i++){var a=r()*6.283,d=r()*24;c.globalAlpha=0.3+r()*0.5;c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*0.7,0.6+r()*1.6,0,Math.PI*2);c.fill();}c.globalAlpha=1;}
function stencilAlien(c,x,y,s,col){c.save();c.shadowColor=col;c.shadowBlur=s*0.9;drawAlien(c,x,y,s,col,'#fff');c.shadowBlur=0;drawAlien(c,x,y,s,col,'#fff');c.restore();}
function stencilUfo(c,x,y,col){c.save();c.shadowColor=col;c.shadowBlur=9;c.fillStyle=col;c.beginPath();c.ellipse(x,y,17,5.5,0,0,Math.PI*2);c.fill();c.beginPath();c.arc(x,y-3,8.5,Math.PI,0);c.fill();c.shadowBlur=0;
  c.fillStyle='rgba(255,255,255,0.9)';for(var i=-1;i<=1;i++){c.beginPath();c.arc(x+i*8.5,y+1.5,1.6,0,Math.PI*2);c.fill();}c.restore();}

/* ---- les vraies pièces des Marsiens : photos du compte Instagram @les_marsiens_13 (publications les plus aimées) ---- */
var CITY_W=1076;
var MURALS=[
  {file:'img/toit-marsiens-2799.jpg',x:272,w:124,strip:19,roof:'flat'},
  {file:'img/toit-vert-1798.jpg',x:400,w:90,strip:12,roof:'flat'},
  {file:'img/mosaique-1244.jpg',x:494,w:100,strip:0,roof:'flat',bottom:true,bh:62},
  {file:'img/on-se-monte-1083.jpg',x:598,w:56,strip:0,roof:'gable'},
  {file:'img/panier-1025.jpg',x:658,w:46,strip:0,roof:'flat'},
  {file:'img/mains-446.jpg',x:708,w:60,strip:13,roof:'flat'}
];
MURALS.forEach(function(m){var im=new Image();im.onload=function(){m.img=im;buildTiles();};im.src=m.file;});
function drawMurals(c,B){
  for(var i=0;i<MURALS.length;i++){var m=MURALS[i],x=m.x,w=m.w;
    var mh=m.img?Math.round(w*m.img.naturalHeight/m.img.naturalWidth):Math.round(w*0.6);
    var h=m.bottom?m.bh:mh+m.strip;
    c.fillStyle='#e9cfa8';c.fillRect(x,B-h,w,h);
    if(m.bottom){
      for(var wy=B-h+7;wy<B-mh-6;wy+=11)for(var wx=x+5;wx<x+w-7;wx+=10){c.fillStyle='#4f7ea3';c.fillRect(wx-1,wy-1,7,8);c.fillStyle='#9cc4e0';c.fillRect(wx,wy,5,6);}
      if(m.img)c.drawImage(m.img,x,B-mh,w,mh);
    }else{
      if(m.img)c.drawImage(m.img,x,B-h,w,mh);else{c.fillStyle='#d9b68e';c.fillRect(x,B-h,w,mh);}
      if(m.strip){c.fillStyle='#3b3f46';c.fillRect(x+Math.round(w/2)-4,B-10,8,10);}
    }
    c.strokeStyle='rgba(40,30,20,0.45)';c.lineWidth=1;c.strokeRect(x+0.5,B-h+0.5,w-1,h-1);
    c.fillStyle='#c7613b';
    if(m.roof==='gable'){c.beginPath();c.moveTo(x-1,B-h);c.lineTo(x+w/2,B-h-11);c.lineTo(x+w+1,B-h);c.closePath();c.fill();}
    else c.fillRect(x-1,B-h-4,w+2,4);
  }
}

/* ================= DÉCOR : MARSEILLE ================= */

/* ciel + soleil */
var skyTile=tile(W,SEA_Y,function(c){
  var g=c.createLinearGradient(0,0,0,SEA_Y);g.addColorStop(0,'#2f9df0');g.addColorStop(0.55,'#8fd0ff');g.addColorStop(1,'#ffe9cc');c.fillStyle=g;c.fillRect(0,0,W,SEA_Y);
  var sg=c.createRadialGradient(232,66,12,232,66,90);sg.addColorStop(0,'rgba(255,240,170,0.75)');sg.addColorStop(1,'rgba(255,240,170,0)');c.fillStyle=sg;c.fillRect(120,-30,260,200);
  c.fillStyle='#fff3b0';c.beginPath();c.arc(232,66,24,0,Math.PI*2);c.fill();
});

/* collines calcaires (Marseilleveyre, Garlaban) + nuages, très loin */
function cloud(c,x,y,s){c.beginPath();c.ellipse(x,y,18*s,9*s,0,0,Math.PI*2);c.ellipse(x-12*s,y+3*s,11*s,7*s,0,0,Math.PI*2);c.ellipse(x+13*s,y+2*s,12*s,7*s,0,0,Math.PI*2);c.ellipse(x+2*s,y-6*s,12*s,8*s,0,0,Math.PI*2);c.fill();}
var farTile=tile(576,170,function(c){
  var B=170;
  c.fillStyle='rgba(255,255,255,0.95)';cloud(c,70,40,1.1);cloud(c,230,22,0.9);cloud(c,350,52,1.3);cloud(c,500,30,1);
  c.fillStyle='#dfe4dc';c.beginPath();c.moveTo(0,B);c.lineTo(0,B-70);
  c.bezierCurveTo(50,B-100,100,B-60,150,B-96);c.bezierCurveTo(200,B-130,250,B-70,300,B-90);c.bezierCurveTo(350,B-110,420,B-50,480,B-80);c.bezierCurveTo(520,B-100,560,B-72,576,B-70);c.lineTo(576,B);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,0.75)';c.lineWidth=2;c.beginPath();c.moveTo(100,B-64);c.lineTo(150,B-96);c.lineTo(190,B-112);c.moveTo(300,B-90);c.lineTo(340,B-104);c.stroke();
  c.fillStyle='#c3cfb4';c.beginPath();c.moveTo(0,B);c.lineTo(0,B-36);
  c.bezierCurveTo(80,B-66,160,B-26,250,B-50);c.bezierCurveTo(330,B-72,420,B-22,500,B-44);c.bezierCurveTo(540,B-55,565,B-38,576,B-36);c.lineTo(576,B);c.closePath();c.fill();
});

/* la ville : Notre-Dame de la Garde, immeubles aux volets bleus, château d'If, Fort Saint-Jean, MuCEM, la Major */
function stripedRect(c,x,y,w,h){c.fillStyle='#f3ebd8';c.fillRect(x,y,w,h);c.fillStyle='#a3b39b';for(var sy=y+3;sy<y+h-1;sy+=6)c.fillRect(x,sy,w,2.5);c.strokeStyle='#858f7a';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,w-1,h-1);}
function buildings(c,B,seed,x0,x1){
  var r=rng(seed),pal=['#efcfa6','#f6e3c6','#e3b388','#eec4ab','#f7e8cc','#dcb591','#f2d6b4','#e8c39e'],x=x0;
  while(x<x1){
    var w=22+Math.floor(r()*22),h=36+Math.floor(r()*42),col=pal[Math.floor(r()*pal.length)];
    if(x+w>x1-1)w=x1-1-x;
    if(w<10)break;
    c.fillStyle=col;c.fillRect(x,B-h,w,h);
    c.fillStyle='rgba(0,0,0,0.07)';c.fillRect(x+w-6,B-h,6,h);
    c.fillStyle='#c7613b';
    if(r()<0.5){c.fillRect(x-1,B-h-4,w+2,4);}
    else{c.beginPath();c.moveTo(x-1,B-h);c.lineTo(x+w/2,B-h-11);c.lineTo(x+w+1,B-h);c.closePath();c.fill();}
    var tagged=r()<0.45&&w>=26&&h>=44;
    for(var wy=B-h+7;wy<(tagged?B-18:B-10);wy+=11)for(var wx=x+5;wx<x+w-7;wx+=10){c.fillStyle='#4f7ea3';c.fillRect(wx-1,wy-1,7,8);c.fillStyle='#9cc4e0';c.fillRect(wx,wy,5,6);}
    if(tagged){var tc=TAGCOLS[Math.floor(r()*TAGCOLS.length)];if(r()<0.55)stencilAlien(c,x+w/2,B-9,5.5,tc);else tagText(c,r()<0.5?'13':'MARS',x+w/2,B-8,10,tc,'#222',0,-0.2);}
    x+=w+1+Math.floor(r()*3);
  }
}
function cityDraw(c){
  var B=270,i,k;
  /* colline de la Bonne Mère */
  c.save();
  c.beginPath();c.moveTo(-10,B);c.bezierCurveTo(20,B-30,60,B-104,112,B-110);c.bezierCurveTo(170,B-114,215,B-60,268,B);c.closePath();
  var hg=c.createLinearGradient(0,B-115,0,B);hg.addColorStop(0,'#aeba80');hg.addColorStop(1,'#73824f');c.fillStyle=hg;c.fill();
  c.clip();
  var r=rng(7);c.fillStyle='rgba(35,85,45,0.45)';
  for(i=0;i<90;i++){var tx=r()*275,ty=B-r()*105;c.beginPath();c.arc(tx,ty,2+r()*3.5,0,Math.PI*2);c.fill();}
  c.strokeStyle='rgba(255,250,235,0.55)';c.lineWidth=2.5;c.beginPath();c.moveTo(30,B);c.bezierCurveTo(90,B-30,50,B-70,108,B-92);c.stroke();
  c.restore();
  /* Notre-Dame de la Garde */
  var cx=112;
  c.fillStyle='#cbb892';c.fillRect(cx-46,B-130,92,22);
  c.fillStyle='#b5a07a';for(k=-46;k<46;k+=9)c.fillRect(cx+k,B-135,5,5);
  c.fillStyle='rgba(0,0,0,0.08)';c.fillRect(cx+12,B-130,34,22);
  stripedRect(c,cx-10,B-164,54,34);
  c.beginPath();c.arc(cx+17,B-164,18,Math.PI,0);c.closePath();c.fillStyle='#9fae95';c.fill();
  c.beginPath();c.arc(cx+17,B-164,12,Math.PI,0);c.closePath();c.fillStyle='#b9c6b0';c.fill();
  c.fillStyle='#e8dfc8';c.fillRect(cx+14,B-189,6,8);c.fillStyle='#f3c431';c.beginPath();c.arc(cx+17,B-191,2,0,Math.PI*2);c.fill();
  stripedRect(c,cx-40,B-214,26,84);
  c.fillStyle='#e8dfc8';c.fillRect(cx-37,B-228,20,14);c.fillStyle='#6f7a6b';c.fillRect(cx-33,B-225,4,8);c.fillRect(cx-25,B-225,4,8);
  c.fillStyle='#bfb59a';c.fillRect(cx-39,B-230,24,3);
  var gg=c.createRadialGradient(cx-27,B-243,1,cx-27,B-243,20);gg.addColorStop(0,'rgba(255,220,90,0.8)');gg.addColorStop(1,'rgba(255,220,90,0)');c.fillStyle=gg;c.fillRect(cx-50,B-266,46,46);
  c.fillStyle='#f3c431';c.fillRect(cx-30,B-234,6,4);
  c.beginPath();c.moveTo(cx-33,B-234);c.lineTo(cx-21,B-234);c.lineTo(cx-27,B-250);c.closePath();c.fill();
  c.beginPath();c.arc(cx-27,B-253,3.5,0,Math.PI*2);c.fill();
  c.strokeStyle='#f3c431';c.lineWidth=2;c.beginPath();c.moveTo(cx-27,B-245);c.lineTo(cx-33,B-241);c.moveTo(cx-27,B-245);c.lineTo(cx-21,B-241);c.stroke();
  /* immeubles devant la colline, puis le quartier des pièces des Marsiens (272 à 768), puis le port décalé de 500 px */
  buildings(c,B,42,0,268);buildings(c,B,43,834,CITY_W);
  drawMurals(c,B);

/* ---- sons (WebAudio, synthétisés) ---- */
var sfx=(function(){
  var ac=null,muted=false;
  try{muted=localStorage.getItem('marsiens_mute')==='1';}catch(e){}
  function get(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
  function tone(f0,f1,dur,type,vol){var a=get();if(!a||muted)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);}
  return{
    unlock:get,
    flap:function(){tone(500,900,0.09,'sine',0.25);},
    point:function(){tone(1000,1000,0.06,'square',0.1);setTimeout(function(){tone(1500,1500,0.08,'square',0.1);},70);},
    hit:function(){tone(200,60,0.18,'sawtooth',0.3);},
    die:function(){tone(700,120,0.4,'triangle',0.25);},
    isMuted:function(){return muted;},
    toggle:function(){muted=!muted;try{localStorage.setItem('marsiens_mute',muted?'1':'0');}catch(e){}return muted;}
  };
})();

/* ---- état du jeu ---- */
var state,ship,pipes,score,best=0,newBest,scroll,frame,flash,overAt;
try{best=parseInt(localStorage.getItem('marsiens_best')||'0',10)||0;}catch(e){}
var START_SCROLL=parseInt((location.search.match(/[?&]s=(\d+)/)||[])[1]||'0',10)||0;
function reset(){state='ready';ship={y:H*0.46,vy:0,rot:0};pipes=[];score=0;newBest=false;scroll=START_SCROLL;frame=0;flash=0;}
function newPipe(x){var gap=curGap();return{x:x,gap:gap,gapY:70+Math.random()*(FLOOR-140-gap),passed:false};}
function flap(){ship.vy=FLAP_V;sfx.flap();}
function action(){
  sfx.unlock();
  if(state==='ready'){state='play';flap();}
  else if(state==='play'){flap();}
  else if(state==='over'){if(performance.now()-overAt>600)reset();}
}
function hit(){state='dead';flash=1;sfx.hit();setTimeout(sfx.die,250);if(ship.vy<0)ship.vy=0;}
function finish(){state='over';overAt=performance.now();if(score>best){best=score;newBest=true;try{localStorage.setItem('marsiens_best',String(best));}catch(e){}}}
function step(){
  frame++;
  if(state==='ready'){ship.y=H*0.46+Math.sin(frame/10)*4;scroll+=BASE_SPEED;return;}
  if(state==='over')return;
  ship.vy=Math.min(ship.vy+G,MAX_V);ship.y+=ship.vy;
  if(ship.y<12){ship.y=12;ship.vy=0;}
  var target=state==='dead'?1.5:(ship.vy<0?-0.35:Math.max(-0.1,Math.min(1.3,(ship.vy-1.8)*0.35)));
  ship.rot+=(target-ship.rot)*(target<ship.rot?0.3:0.1);
  var i,p;
  if(state==='play'){
    var sp=curSpeed();
    scroll+=sp;
    for(i=0;i<pipes.length;i++){p=pipes[i];p.x-=sp;if(!p.passed&&p.x+PIPE_W/2<SHIP_X){p.passed=true;score++;sfx.point();}}
    if(pipes.length&&pipes[0].x<-PIPE_W-4)pipes.shift();
    var last=pipes[pipes.length-1];
    if(!last)pipes.push(newPipe(W+100));else if(last.x<W-PIPE_DIST)pipes.push(newPipe(last.x+PIPE_DIST));
    var hx=SHIP_X-HIT_W/2,hy=ship.y-HIT_H/2;
    for(i=0;i<pipes.length;i++){p=pipes[i];if(hx+HIT_W>p.x&&hx<p.x+PIPE_W&&(hy<p.gapY||hy+HIT_H>p.gapY+p.gap)){hit();break;}}
  }
  if(ship.y+HIT_H/2>=FLOOR){ship.y=FLOOR-HIT_H/2;if(state==='play'){flash=1;sfx.hit();}finish();}
}

  var k=Math.min(1,(now-overAt)/400),e=1-Math.pow(1-k,3),dy=(1-e)*60;
  ctx.globalAlpha=e;
  text('GAME OVER',W/2,150,18,'#feda75','#2b2b2b');
  var px=28,py=182+dy,pw=232,ph=122;
  rrect(ctx,px,py,pw,ph,8);ctx.fillStyle='#e0d896';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#5a3b2b';ctx.stroke();
  text('SCORE',px+pw-18,py+24,9,'#e86a17','#5a3b2b','right',3);
  text(String(score),px+pw-18,py+46,16,'#fff','#5a3b2b','right');
  text('MEILLEUR',px+pw-18,py+76,9,'#e86a17','#5a3b2b','right',3);
  text(String(best),px+pw-18,py+98,16,'#fff','#5a3b2b','right');
  if(newBest){rrect(ctx,px+pw-86,py+58,34,13,3);ctx.fillStyle='#e23f3f';ctx.fill();text('NEW',px+pw-69,py+65,6,'#fff',null);}
  text('MEDAILLE',px+62,py+17,7,'#e86a17','#5a3b2b',null,2.5);
  drawMedal(px+62,py+ph/2+6,score,now);
  var by=py+ph+18;rrect(ctx,W/2-62,by,124,38,8);ctx.fillStyle='#73bf2e';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#3f6b15';ctx.stroke();
  text('REJOUER',W/2,by+19,10,'#fff','#2f5a14',null,3);
  ctx.globalAlpha=1;
}
function render(now){
  ctx.drawImage(skyTile.c,0,0,W,SEA_Y);
  drawGulls(now);
  drawTile(farTile,0.1,SEA_Y-farTile.h);
  drawTile(cityTile,0.3,SEA_Y-cityTile.h);
  drawWheels(now);
  drawTile(seaTile,0.5,SEA_Y-50);
  drawTile(promTile,0.75,FLOOR-promTile.h);
  for(var i=0;i<pipes.length;i++)drawPipe(pipes[i]);
  drawTile(quayTile,1,FLOOR);
  drawShip(ctx,SHIP_X,ship.y,ship.rot,now,state==='play'&&ship.vy<-1.5);
  if(state==='ready')drawReady(now);
  else if(state==='play'||state==='dead')text(String(score),W/2,58,24,'#fff','#2b2b2b');
  else if(state==='over')drawOver(now);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-0.07);}
}

/* ---- entrées ---- */
canvas.addEventListener('pointerdown',function(e){e.preventDefault();action();});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Enter'){e.preventDefault();action();}});
var muteBtn=document.getElementById('mute');
function syncMute(){muteBtn.textContent=sfx.isMuted()?'🔇':'🔊';muteBtn.setAttribute('aria-pressed',sfx.isMuted()?'true':'false');}
muteBtn.addEventListener('click',function(e){e.stopPropagation();sfx.toggle();syncMute();});
syncMute();

/* ---- boucle à pas fixe (60 Hz) ---- */
var last=performance.now(),acc=0,STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){step();acc-=STEP;}render(now);requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
